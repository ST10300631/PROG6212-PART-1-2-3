name: Build and Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0' # Change to your target .NET version if needed

    - name: Restore dependencies
      run: dotnet restore RaceDayApi/RaceDayApi/RaceDayApi.csproj

    - name: Build project
      run: dotnet build RaceDayApi/RaceDayApi/RaceDayApi.csproj --no-restore
